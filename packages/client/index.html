<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Floorfight</title>
    <style>
      :root {
        --ink: #f4f1ea;
        --dim: rgba(244, 241, 234, 0.6);
        --panel: rgba(18, 20, 24, 0.62);
        --hit: #ffffff;
        --kill: #ff4b3a;
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1c20; color: var(--ink);
        font: 14px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; user-select: none;
        -webkit-user-select: none; touch-action: none; }
      canvas { display: block; width: 100vw; height: 100vh; }
      .hud { position: fixed; pointer-events: none; }

      #crosshair { left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; }
      #crosshair::before, #crosshair::after { content: ""; position: absolute; background: var(--ink);
        box-shadow: 0 0 2px #000; }
      #crosshair::before { left: 8px; top: 0; width: 2px; height: 18px; }
      #crosshair::after { top: 8px; left: 0; height: 2px; width: 18px; }

      #hitmarker { left: 50%; top: 50%; width: 34px; height: 34px; margin: -17px 0 0 -17px; opacity: 0;
        transition: opacity 180ms ease-out; }
      #hitmarker.show { opacity: 1; transition: none; }
      #hitmarker i { position: absolute; width: 3px; height: 11px; background: var(--hit); left: 15px; top: 11px;
        box-shadow: 0 0 2px #000; }
      #hitmarker i:nth-child(1) { transform: rotate(45deg) translateY(-12px); }
      #hitmarker i:nth-child(2) { transform: rotate(135deg) translateY(-12px); }
      #hitmarker i:nth-child(3) { transform: rotate(225deg) translateY(-12px); }
      #hitmarker i:nth-child(4) { transform: rotate(315deg) translateY(-12px); }
      #hitmarker.head i { background: #ffd23a; }
      #hitmarker.kill i { background: var(--kill); height: 14px; }

      #timer { top: 12px; left: 50%; transform: translateX(-50%); font: 700 26px/1 var(--mono);
        background: var(--panel); padding: 8px 14px; border-radius: 6px; letter-spacing: 1px; }
      #timer.low { color: var(--kill); }

      #board { top: 12px; left: 12px; background: var(--panel); border-radius: 6px; padding: 8px 10px;
        font: 13px/1.5 var(--mono); min-width: 170px; }
      #board .row { display: flex; gap: 10px; }
      #board .row.me { color: #ffd23a; }
      #board .row.empty { color: var(--dim); }
      #board .name { flex: 1; }
      #board .head { color: var(--dim); font-size: 11px; }
      #board .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }

      #feed { top: 12px; right: 12px; display: flex; flex-direction: column; align-items: flex-end; gap: 4px;
        font: 13px/1.3 var(--mono); }
      #feed div { background: var(--panel); padding: 4px 8px; border-radius: 4px; animation: fade 5s forwards; }
      #feed .me { outline: 1px solid #ffd23a; }
      @keyframes fade { 0%, 80% { opacity: 1; } 100% { opacity: 0; } }

      #hp { bottom: 16px; left: 16px; font: 700 28px/1 var(--mono); background: var(--panel);
        padding: 8px 14px; border-radius: 6px; }
      #net { bottom: 16px; right: 16px; font: 11px/1.4 var(--mono); color: var(--dim); text-align: right; }

      #center { left: 50%; top: 36%; transform: translate(-50%, -50%); text-align: center; font-size: 18px;
        background: var(--panel); padding: 12px 18px; border-radius: 8px; max-width: 80vw; }
      #center:empty { display: none; }

      #over { inset: 0; display: none; align-items: center; justify-content: center; background: rgba(10, 11, 13, 0.78);
        pointer-events: auto; }
      #over.show { display: flex; }
      #over .card { background: #1f2227; border-radius: 10px; padding: 20px 24px; width: min(520px, 92vw); }
      #over h1 { margin: 0 0 12px; font-size: 22px; }
      #over table { width: 100%; border-collapse: collapse; font: 14px/1.6 var(--mono); }
      #over th { text-align: left; color: var(--dim); font-weight: 400; }
      #over td, #over th { padding: 2px 6px; }
      #over tr.me td { color: #ffd23a; }
      #over .hash { margin-top: 14px; font: 12px/1.4 var(--mono); word-break: break-all; color: var(--dim); }
      #over .hash b { color: var(--ink); font-weight: 400; }
      #over button { margin-top: 16px; font: inherit; padding: 8px 16px; border-radius: 6px; border: 0;
        background: #ffd23a; color: #1a1c20; cursor: pointer; }

      #fire { right: 28px; bottom: 90px; width: 84px; height: 84px; border-radius: 50%; display: none;
        background: rgba(255, 75, 58, 0.45); border: 2px solid rgba(255, 255, 255, 0.6); pointer-events: auto; }
      #jump { right: 124px; bottom: 38px; width: 68px; height: 68px; border-radius: 50%; display: none;
        background: rgba(47, 109, 223, 0.45); border: 2px solid rgba(255, 255, 255, 0.6); pointer-events: auto;
        color: var(--ink); font: 700 13px/68px var(--mono); text-align: center; letter-spacing: 1px; }
      #stick { width: 90px; height: 90px; margin: -45px 0 0 -45px; border-radius: 50%; display: none;
        border: 2px solid rgba(255, 255, 255, 0.4); }
      @media (pointer: coarse) { #fire, #jump { display: block; } #board { font-size: 11px; min-width: 140px; } }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="crosshair" class="hud"></div>
    <div id="hitmarker" class="hud"><i></i><i></i><i></i><i></i></div>
    <div id="timer" class="hud">1:30</div>
    <div id="board" class="hud"></div>
    <div id="feed" class="hud"></div>
    <div id="hp" class="hud">100</div>
    <div id="net" class="hud"></div>
    <div id="center" class="hud"></div>
    <div id="stick" class="hud"></div>
    <div id="fire" class="hud"></div>
    <div id="jump" class="hud">JUMP</div>
    <div id="over" class="hud">
      <div class="card">
        <h1>Round over</h1>
        <table><thead><tr><th>#</th><th>Player</th><th>K</th><th>D</th></tr></thead><tbody></tbody></table>
        <div class="hash">Match log hash<br /><b></b></div>
        <button type="button">Play again</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
