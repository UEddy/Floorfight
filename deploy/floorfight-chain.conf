# Staked rooms, as a drop-in on floorfight.service.
#
#   mkdir -p /etc/systemd/system/floorfight.service.d
#   cp deploy/floorfight-chain.conf /etc/systemd/system/floorfight.service.d/chain.conf
#   systemctl daemon-reload && systemctl restart floorfight
#
# Before copying it in:
#
# 1. The resolver keypair is at /etc/floorfight/resolver.json, owned by the
#    floorfight user and mode 600. The server reads the mode at startup and
#    refuses to run if group or others can read it. It is never in the repo,
#    never in the APK, and never pasted anywhere else.
#
# 2. The program is deployed and its config initialised with this resolver's
#    public key (scripts/init-config.ts, run on your own machine with the
#    deployer key, not here).
#
# All three settings together or none. One or two of them is a configuration
# error and the server refuses to start: a server that takes stakes with no
# way to settle them is worse than one that will not come up. The start limit
# in the main unit is what stops that refusal turning into an endless restart
# loop.
#
# HELIUS_API_KEY is for NFT heads in holders matches. It stays on the server:
# the client asks /api/nfts and /api/nft-img, never Helius. Put it in an
# EnvironmentFile readable only by root rather than in this file, so it is
# not in a world readable unit:
#
#   install -m 600 -o root -g root /dev/null /etc/floorfight/helius.env
#   echo 'HELIUS_API_KEY=...' > /etc/floorfight/helius.env
#
# The leading minus means a missing file is not an error: no key, no NFT
# heads, and everybody wears the default face.
#
# Test SKR pots (devnet) are off until SKR_POT_MINT names the devnet test
# mint from scripts/create-test-skr.ts, after scripts/allow-mint.ts has put
# it on the program's allowlist. Uncomment the line below with that address.
# It is a public address, not a secret. The server refuses to start if it is
# the mainnet SKR mint.

[Service]
Environment=RPC_URL=https://api.devnet.solana.com
Environment=PROGRAM_ID=HoktNWjdhuts9nzV76UyqUn6FCqJ57LwAizFYbjD4TCe
Environment=RESOLVER_KEYPAIR_PATH=/etc/floorfight/resolver.json
EnvironmentFile=-/etc/floorfight/helius.env
# Environment=SKR_POT_MINT=<devnet test mint address>
